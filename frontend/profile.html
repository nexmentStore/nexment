<header class="navbar">

<div class="nav-container">

<div class="brand">
<img src="../assets/logo.png">
<span>Nexment</span>
</div>

<nav class="nav-links">
<a href="index.html">Home</a>
<a href="products.html">Store</a>

</nav>

<div class="mobile-icons">

<a href="cart.html" class="mobile-cart">
<i class="fa-solid fa-cart-shopping"></i>
</a>

<button id="menuBtn">
<i class="fa-solid fa-bars"></i>
</button>

</div>

</div>

</header>



<div id="sidebar" class="sidebar">

<span>Menu</span>

<button id="closeSidebar">
<i class="fa-solid fa-xmark"></i>
</button>

</div>

<a href="index.html">Home</a>

</div>



<section class="profile-container">

<div id="guestView" class="guest-view">

<i class="fa-solid fa-user-lock"></i>

<h2>You are not signed in</h2>

<p>
Please sign in to access your profile, purchased resources, and cart.
</p>

<a href="auth.html" class="signin-btn">
Go to Sign In
</a>

</div>



<div id="profileView" class="profile-view">

<h1>My Profile</h1>

<div class="profile-info">

<div class="info-row">
<i class="fa-solid fa-user"></i>
<span id="username"></span>
</div>

<div class="info-row">
<i class="fa-solid fa-envelope"></i>
<span id="email"></span>
</div>

<div class="info-row">
<i class="fa-solid fa-calendar"></i>
<span id="createdAt"></span>
</div>

<div class="info-row">
<i class="fa-solid fa-wallet"></i>
<span id="totalSpent"></span>
</div>

</div>



<div class="profile-actions">

<a href="library.html" class="action-btn">
<i class="fa-solid fa-book"></i>
My Library
</a>

<a href="cart.html" class="action-btn">
<i class="fa-solid fa-cart-shopping"></i>
My Cart
</a>

<button id="logoutBtn" class="logout-btn">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</button>

</div>

</div>

</section>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
