<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexment Store</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/products.css">
<meta name="description" content="Nexment is a digital resource store offering premium ebooks and learning materials designed to help you learn faster and build valuable skills.">

<meta name="keywords" content="Nexment, ebooks, digital resources, online learning ebooks, skill development ebooks, AI learning resources, productivity guides, freelancing guides, digital learning materials">

<meta name="author" content="Nexment">

<meta name="robots" content="index, follow">

<meta name="language" content="English">

<meta name="revisit-after" content="7 days">

<meta name="distribution" content="global">

<meta name="rating" content="general">

<meta name="theme-color" content="#4F46E5">
<script src="https://kit.fontawesome.com/be695597a3.js" crossorigin="anonymous"></script>

</head>

<body>


<header class="navbar">

<div class="nav-container">

<div class="brand">
<img src="../assets/logo.png">
<span>Nexment</span>
</div>

<nav class="nav-links">
<a href="index.html">Home</a>
<a href="products.html">Store</a>
<a href="about.html">About</a>
<a href="cart.html">Cart</a>
<a href="profile.html">Profile</a>
</nav>

<div class="mobile-icons">

<a href="cart.html" class="mobile-cart">
<i class="fa-solid fa-cart-shopping"></i>
</a>

<button id="menuBtn">
<i class="fa-solid fa-bars"></i>
</button>

</div>

</div>

</header>



<div id="sidebar" class="sidebar">

<div class="sidebar-header">
<span>Menu</span>

<button id="closeSidebar">
<i class="fa-solid fa-xmark"></i>
</button>

</div>

<a href="index.html">Home</a>
<a href="products.html">Store</a>
<a href="about.html">About</a>
<a href="cart.html">Cart</a>
<a href="profile.html">Profile</a>

</div>



<section class="store-header">

<h1>Nexment Store</h1>

<div class="store-controls">

<div class="search-bar">

<input id="searchInput" placeholder="Search ebooks">

<button id="searchBtn">
<i class="fa-solid fa-magnifying-glass"></i>
</button>

</div>

</div>


<div class="category-buttons">

<button class="category-btn active" data-category="all">All</button>
<button class="category-btn" data-category="ai">AI</button>
<button class="category-btn" data-category="productivity">Productivity</button>
<button class="category-btn" data-category="freelancing">Freelancing</button>
<button class="category-btn" data-category="skills">Skills</button>

</div>

</section>



<section class="products-section">

<div id="productsGrid" class="products-grid"></div>

</section>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="js/ui.js"></script>
<script src="js/firebase.js"></script>
<script src="js/products.js"></script>

</body>
</html>
